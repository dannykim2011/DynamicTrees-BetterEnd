import java.time.Instant
import java.time.format.DateTimeFormatter

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://harleyoconnor.com/maven'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://maven.parchmentmc.org'
    }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.main.java {
    exclude 'com/dtteam/dynamictreesplus/**'
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client {
            client()
            gameDirectory = file('run')

            if (project.hasProperty('mcUuid')) {
                programArguments.addAll '--uuid', project.mcUuid
            }
            if (project.hasProperty('mcUsername')) {
                programArguments.addAll '--username', project.mcUsername
            }
            if (project.hasProperty('mcAccessToken')) {
                programArguments.addAll '--accessToken', project.mcAccessToken
            }
        }

        server {
            server()
            gameDirectory = file('run-server')
        }

        data {
            data()
            gameDirectory = file('run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'dynamictrees',
                    '--existing-mod', 'betterend'
        }
    }
}

dependencies {
    def dynamicTreesPlusJar = file('../DynamicTreesPlus 26.1.2/variant-libs/dynamictreesplus-26.1.2-betterend.jar')
    implementation "com.dtteam.dynamictrees:dynamictrees-neoforge-${minecraft_version}:${dynamic_trees_version}"
    compileOnly files(dynamicTreesPlusJar)
    implementation "curse.maven:betterend-neoforge-1422294:${betterend_file_id}"
    implementation "curse.maven:bclib-neoforge-1422283:${bclib_file_id}"
    implementation "curse.maven:worldweaver-neoforge-1422284:${worldweaver_file_id}"
    implementation "curse.maven:wunderlib-neoforge-1422273:${wunderlib_file_id}"
    implementation "curse.maven:patchouli-306770:${patchouli_file_id}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'assets/dynamictreesplus/**'
    exclude 'data/dynamictreesplus/**'
    exclude 'trees/dynamictreesplus/**'

    def replaceProperties = [
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            minecraft_version_range    : minecraft_version_range,
            dynamic_trees_version      : dynamic_trees_version,
            betterend_version          : betterend_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title': project.name,
                'Specification-Vendor': 'Max Hyper',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Max Hyper',
                'Implementation-Timestamp': DateTimeFormatter.ISO_INSTANT.format(Instant.now())
        )
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
