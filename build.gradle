buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.42'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven { url = 'https://harleyoconnor.com/maven' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'dynamictrees',
                    '--existing-mod', 'betterend'
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:dynamictrees-252818:${dynamic_trees_file_id}")
    implementation fg.deobf("curse.maven:betterend-forge-1435127:${betterend_file_id}")
    implementation fg.deobf("curse.maven:dynamictreesplus-478155:${dynamic_trees_plus_file_id}")
    implementation fg.deobf("curse.maven:bclib-forge-1435106:${bclib_forge_file_id}")
    runtimeOnly fg.deobf("curse.maven:wunderlib-forge-1435097:${wunderlib_forge_file_id}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            forge_version: forge_version,
            dynamic_trees_version: dynamic_trees_version,
            dynamic_trees_plus_version: dynamic_trees_plus_version,
            betterend_version: betterend_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
    finalizedBy 'reobfJar'
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
